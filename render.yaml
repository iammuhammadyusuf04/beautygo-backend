services:
  - type: web
    name: beautygo-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: BOT_TOKEN
        sync: false # Set manually in Render Dashboard -> Environment (never commit real tokens here)
      - key: NODE_ENV
        value: production
